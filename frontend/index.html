<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <!-- Character encoding and viewport settings -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Page title and description for SEO -->
    <title>Market Breadth Dashboard | Real-time Indian Stock Market Analysis</title>
    <meta name="description" content="Real-time market breadth dashboard for Indian stock indices including NIFTY 50, NIFTY Bank, and more. Track bullish and bearish stocks live." />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    
    <!-- Preconnect to Google Fonts for better performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Load Inter font for clean typography -->
    <link 
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" 
      rel="stylesheet" 
    />
    
    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#0f172a" />
  </head>
  <body class="bg-dashboard-bg min-h-screen">
    <!-- 
      Root element where React app is mounted.
      The entire application renders inside this div.
    -->
    <div id="root"></div>
    
    <!-- 
      Vite injects the main.jsx script here during development.
      In production, it's bundled into optimized chunks.
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
